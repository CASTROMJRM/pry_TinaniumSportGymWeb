name: 'PWA Titanium - pruebas y Lighthouse'

on:
  push:
    branches:
      - feature/pwa-titanium

permissions:
  contents: read

jobs:
  pruebas:
    name: 'Calidad, unitarias e integración offline'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener la rama de la PWA
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias sin modificar package-lock.json
        run: npm ci
      - name: Análisis estático ESLint
        run: npm run lint
      - name: Pruebas unitarias de rutas públicas
        run: node --experimental-strip-types --test tests/unit/*.test.mjs
      - name: Compilar PWA de producción
        run: npm run build
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Integración y funcionamiento offline
        run: npm run test:pwa

  lighthouse:
    name: 'Auditoría Google Lighthouse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener la rama de la PWA
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Generar build de producción
        run: npm run build
      - name: Generar reportes Lighthouse HTML y JSON temporalmente
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs
      - name: Mostrar puntuaciones Lighthouse sin subir artefactos
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = path.join(process.cwd(), 'lighthouse-reports');
          if (!fs.existsSync(directory)) {
            console.log('No hay reportes Lighthouse disponibles.');
            process.exit(0);
          }
          const files = fs.readdirSync(directory).filter((file) => file.endsWith('.report.json'));
          const rows = files.map((file) => {
            const report = JSON.parse(fs.readFileSync(path.join(directory, file), 'utf8'));
            const url = new URL(report.finalUrl || report.requestedUrl).pathname;
            const percentage = (category) => {
              const score = report.categories?.[category]?.score;
              return typeof score === 'number' ? Math.round(score * 100) : 'N/D';
            };
            return `| ${url} | ${percentage('performance')} | ${percentage('accessibility')} | ${percentage('best-practices')} | ${percentage('seo')} |`;
          });
          const lines = [
            '## Google Lighthouse (build local)',
            '',
            '| Ruta | Rendimiento | Accesibilidad | Buenas prácticas | SEO |',
            '| --- | ---: | ---: | ---: | ---: |',
            ...(rows.length ? rows : ['| Sin reportes | — | — | — | — |']),
            '',
            'Escala de 0 a 100. Auditoría local de la compilación; no evalúa el despliegue en Vercel.',
          ];
          console.log(lines.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          }
          NODE
